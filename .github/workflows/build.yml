name: Build open-source iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: pyto-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Identify pinned submodule sources
        id: submodule-key
        shell: bash
        run: echo "hash=$(git ls-files --stage | awk '$1 == 160000' | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore public submodule source cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: ${{ runner.os }}-pyto-submodules-${{ steps.submodule-key.outputs.hash }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Record toolchain and install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-local
          xcodebuild -version | tee build-local/toolchain.log
          xcodebuild -showsdks | tee -a build-local/toolchain.log
          xcrun --sdk iphoneos --show-sdk-path | tee -a build-local/toolchain.log
          xcrun --sdk watchos --show-sdk-path | tee -a build-local/toolchain.log
          python3.10 --version | tee -a build-local/toolchain.log
          command -v pod || brew install cocoapods
          pod --version | tee -a build-local/toolchain.log
      - name: Prepare pinned sources, pods and Python packages
        env:
          PYTO_PREPARE_BASE_ONLY: '1'
        shell: bash
        run: bash build-ios.sh prepare
      - name: Restore official pinned SSH command framework
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ssh_cmd.xcframework.zip"
          curl --fail --location --retry 3 https://github.com/holzschu/ios_system/releases/download/v3.0.0/ssh_cmd.xcframework.zip -o "$ARCHIVE"
          echo "9b57b07d4e552f30f7127843860defe4e8edbad8c0b5f2e4c7e99399713b87e6  $ARCHIVE" | shasum -a 256 -c -
          unzip -q -o "$ARCHIVE" -d Extensions/Dependencies/ios_system
          test -f Extensions/Dependencies/ios_system/ssh_cmd.xcframework/Info.plist
      - name: Restore official ios_system and LLVM 14 frameworks with published checksums
        shell: bash
        run: python3.10 .github/restore-llvm.py | tee build-local/llvm-frameworks.log
      - name: Check target Python ABI and Xcode project tooling
        shell: bash
        run: |
          set -euo pipefail
          xcrun nm -gU python3_ios/Python3_ios/libPython3.10.a | grep -E '[[:space:]]T __PyUnicode_DecodeUnicodeEscape$' >/dev/null
          ruby -r xcodeproj -e 'puts Xcodeproj::VERSION' || gem install --user-install --no-document xcodeproj -v 1.27.0
          ruby -c .github/sync-native-frameworks.rb
      - name: Identify native cache toolchain
        id: native-key
        shell: bash
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled iOS dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Extensions/*
            !Extensions/Dependencies
            !Extensions/Dependencies/**
            site-packages
          key: ${{ runner.os }}-intel-ios-native-v1-${{ steps.native-key.outputs.xcode }}-${{ steps.submodule-key.outputs.hash }}-${{ hashFiles('Extensions/Dependencies/tools/**', '!Extensions/Dependencies/tools/build-docs.sh', 'setup.sh', 'build-constraints.txt') }}
      - name: Refresh documentation theme without rebuilding native libraries
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- site-packages/requirements.txt site-packages/install.sh
          source .venv-build/bin/activate
          python3 -m pip install --no-deps --upgrade --target site-packages 'alabaster==0.7.16'
      - name: Validate host SciPy tooling and its OpenMP runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/build-constraints.txt"
          brew list gcc@14 >/dev/null 2>&1 || brew install gcc@14
          GOMP="$(find "$(brew --prefix gcc@14)/lib" -name libgomp.dylib -type f -print -quit)"
          # Some Homebrew versions expose this library through a symlink.
          if [[ -z "$GOMP" ]]; then
            GOMP="$(find "$(brew --prefix gcc@14)/lib" -name libgomp.dylib -print -quit)"
          fi
          [[ -f "$GOMP" ]] || { echo 'Missing host libgomp.dylib' >&2; exit 2; }
          export LD_LIBRARY_PATH="$(dirname "$GOMP")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          # This is a host Python import path, never an iOS linker search path.
          python3 -m pip install 'pybind11==2.7.1' 'pythran==0.9.12'
          python3 Extensions/Dependencies/tools/check-scipy-build-ext.py
      - name: Build and validate native XML before starting the Fortran VM
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/build-constraints.txt"
          bash Extensions/Dependencies/tools/build-lxml.sh 2>&1 | tee build-local/xml-build.log
      - name: Build and validate native YAML before starting the Fortran VM
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/build-constraints.txt"
          bash Extensions/Dependencies/tools/build-pyyaml.sh 2>&1 | tee build-local/yaml-build.log
      - name: Start Docker for the historical iOS Fortran compiler
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/setup-docker-fortran.sh 2>&1 | tee build-local/docker-setup.log
      - name: Verify Docker and shared source access before compiling
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker info | tee build-local/docker.log
          docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" alpine:3.22 test -f /source/setup.sh
      - name: Build remaining native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/build-constraints.txt"
          export PYTO_XML_READY=1
          export PYTO_YAML_READY=1
          export PYTO_SKIP_DOCS=1
          bash Extensions/Dependencies/tools/build.sh 2>&1 | tee build-local/native-build.log
          bash Extensions/Dependencies/tools/copy-eggs.sh
          find site-packages -name '*.so' -delete
      - name: Validate native device frameworks
        shell: bash
        run: python3 .github/validate-native.py | tee build-local/native-validation.log
      - name: Synchronize Xcode references with generated frameworks
        shell: bash
        run: ruby .github/sync-native-frameworks.rb | tee build-local/framework-sync.log
      - name: Save compiled iOS dependencies before documentation and Xcode
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Extensions/*
            !Extensions/Dependencies
            !Extensions/Dependencies/**
            site-packages
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Restore bundled documentation archives
        id: documentation-cache
        uses: actions/cache/restore@v4
        with:
          path: documentations/*.zip
          key: ${{ runner.os }}-pyto-docs-v1-${{ steps.submodule-key.outputs.hash }}-${{ hashFiles('Extensions/Dependencies/tools/build-docs.sh', 'docs/build-constraints.txt', 'build-constraints.txt', 'documentations/compress.py') }}
      - name: Build bundled third-party documentation
        if: steps.documentation-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/docs/build-constraints.txt"
          bash Extensions/Dependencies/tools/build-docs.sh 2>&1 | tee build-local/third-party-docs.log
      - name: Save bundled documentation archives
        if: steps.documentation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: documentations/*.zip
          key: ${{ steps.documentation-cache.outputs.cache-primary-key }}
      - name: Build application documentation
        shell: bash
        run: |
          set -euo pipefail
          source .venv-build/bin/activate
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/docs/build-constraints.txt"
          make -C docs html 2>&1 | tee build-local/docs-build.log
      - name: Build full-feature open-source edition and package unsigned IPA
        shell: bash
        run: bash build-ios.sh build
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pyto-OpenSource-unsigned
          path: build-local/Pyto-source-build-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Save public submodule sources for the next attempt
        if: always() && steps.submodule-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: ${{ runner.os }}-pyto-submodules-${{ steps.submodule-key.outputs.hash }}
      - name: Preserve diagnostic logs even if the build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            setup-build.log
            build-local/*.log
            build-local/*.txt
          if-no-files-found: warn
          retention-days: 14
